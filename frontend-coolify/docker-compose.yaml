version: "3.9"

services:
  # =========================
  # 🧠 SHELL APP (Main Entry)
  # =========================
  shell-app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: shell
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_URL: http://auth-app:3002
      POST_URL: http://post-app:3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    expose:
      - "3000"
    depends_on:
      - auth-app
      - post-app
    labels:
      - "coolify.exposed_port=3000"

  # =========================
  # 🔐 AUTH APP
  # =========================
  auth-app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: auth
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    expose:
      - "3002"

  # =========================
  # 📝 POST APP
  # =========================
  post-app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: post
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST: ${NEXT_PUBLIC_CLOUDFLARE_UPLOAD_HOST}
    expose:
      - "3003"
